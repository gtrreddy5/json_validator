<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>{% block title %}JSON Validator & Formatter | Online JSON Tools{% endblock %}</title>

    <meta name="keywords" content="json validator, json formatter, json minify, json beautify, online json tools">

    <!-- Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Open Graph (for sharing) -->

    <meta property="og:description" content="{% block og_description %}Validate, beautify, and minify JSON online for free.{% endblock %}">
    <meta property="og:url" content="https://json-tools-online.com">
    <meta property="og:type" content="website">

    <!-- Favicon -->

    <!-- Google tag (gtag.js) -->

    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-SE70PJE414');
    </script>
    <!-- CSS -->
    <link rel="stylesheet" href="/static/style.css">

<body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
</body>
</html>
